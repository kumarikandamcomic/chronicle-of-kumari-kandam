<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator dashboard | Chronicle of Kumari Kandam</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--green:#185b2a;--line:#dce9da;--muted:#667468}*{box-sizing:border-box}body{margin:0;background:#f7fbf5;color:#17231a;font:16px/1.6 Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:30px 18px 70px}h1,h2{color:var(--green)}h1{font-family:Georgia,serif}section,.panel{background:white;border:1px solid var(--line);padding:22px;margin:18px 0;border-radius:5px}input,button{font:inherit;padding:10px;border:1px solid #cbdcc8;border-radius:4px}input{display:block;width:100%;margin:7px 0 14px}button{cursor:pointer;background:var(--green);color:white;border:0;margin:4px 4px 4px 0}button.danger{background:#8d342e}button.secondary{background:white;color:var(--green);border:1px solid var(--line)}.muted{color:var(--muted);font-size:.9rem}.item{padding:16px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.item:last-child{border-bottom:0}.row{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.hidden{display:none!important}#status{min-height:1.5em;color:var(--green)}.tag{font-size:.8rem;color:var(--muted)}</style></head><body><main class="wrap"><div class="row"><div><h1>Creator dashboard</h1><p class="muted">Private reviews and comic-copy requests</p></div><button id="signout" class="secondary hidden">Sign out</button></div><section id="login"><h2>Creator sign in</h2><p class="muted">Sign in with your Supabase Auth account.</p><form id="login-form"><label>Email address</label><input id="email" type="email" placeholder="Enter creator email" required autocomplete="off"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button type="submit">Sign in</button></form><p id="login-status"></p></section><div id="dashboard" class="hidden"><p id="status" role="status"></p><section><div class="row"><h2>Reader reviews</h2><button class="secondary" id="refresh-reviews">Refresh</button></div><p class="muted">New reviews stay hidden from the public until you approve them. You can delete any review.</p><div id="reviews"></div></section><section><div class="row"><h2>Copy requests</h2><button class="secondary" id="refresh-requests">Refresh</button></div><p class="muted">Only signed-in creator access can read these requests.</p><div id="requests"></div></section></div></main><script>
const URL='https://dzgmiyclvuenatkfijwz.supabase.co';const KEY='sb_publishable_ddowd75H1tpslnbM6UuRhQ_2Q-lKi1R';const $=s=>document.querySelector(s);
if(!window.supabase){$('#login-status').textContent='Could not load the sign-in service. Check your internet connection, disable blocking for this page, then reload.';}
const client=window.supabase ? window.supabase.createClient(URL,KEY) : null;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function ensureOwner(){
 if(!client){$('#login-status').textContent='Sign-in service did not load. Reload the page and try again.';return false;}
 try {
  const {data,error}=await client.auth.getUser();
  if(error) throw error;
  if(!data?.user){$('#login').classList.remove('hidden');$('#dashboard').classList.add('hidden');$('#signout').classList.add('hidden');return false;}
  $('#login').classList.add('hidden');$('#dashboard').classList.remove('hidden');$('#signout').classList.remove('hidden');
  $('#status').textContent='Signed in. Loading private records…';
  await loadAll();
  return true;
 } catch(err){$('#login-status').textContent='Could not check sign-in: '+(err?.message||String(err));return false;}
}
$('#login-form').addEventListener('submit',async e=>{
 e.preventDefault();
 if(!client){$('#login-status').textContent='Sign-in service did not load. Check your internet connection and reload this page.';return;}
 const button=$('#login-form button[type="submit"]');button.disabled=true;button.textContent='Signing in…';$('#login-status').textContent='Connecting to Supabase…';
 try {
  const {error}=await client.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});
  if(error){$('#login-status').textContent='Sign-in failed: '+error.message;return;}
  $('#email').value='';$('#password').value='';
  await ensureOwner();
 } catch(err){$('#login-status').textContent='Sign-in error: '+(err?.message||String(err));}
 finally {button.disabled=false;button.textContent='Sign in';}
});
$('#signout').addEventListener('click',async()=>{await client.auth.signOut();location.reload();});
async function loadReviews(){const host=$('#reviews');host.textContent='Loading…';const {data,error}=await client.from('reviews').select('*').order('created_at',{ascending:false});if(error){host.textContent='Could not load reviews: '+error.message;return;}if(!data?.length){host.textContent='No reviews submitted yet.';return;}host.innerHTML=data.map(r=>`<div class="item"><div class="row"><strong>${esc(r.reader_name||'Anonymous')} · ${'★'.repeat(Number(r.rating)||0)}</strong><span class="tag">${esc(r.created_at?new Date(r.created_at).toLocaleString():'')}</span></div><p>${esc(r.review_text)}</p><p>Status: <strong>${r.approved?'Approved / public':'Pending / private'}</strong></p><button data-approve="${r.id}" data-value="${!r.approved}">${r.approved?'Hide review':'Approve review'}</button><button class="danger" data-delete-review="${r.id}">Delete review</button></div>`).join('');host.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{const {error}=await client.from('reviews').update({approved:b.dataset.value==='true'}).eq('id',b.dataset.approve);$('#status').textContent=error?'Update failed: '+error.message:'Review status updated.';await loadReviews();});host.querySelectorAll('[data-delete-review]').forEach(b=>b.onclick=async()=>{if(!confirm('Permanently delete this review?'))return;const {error}=await client.from('reviews').delete().eq('id',b.dataset.deleteReview);$('#status').textContent=error?'Delete failed: '+error.message:'Review deleted.';await loadReviews();});}
async function loadRequests(){const host=$('#requests');host.textContent='Loading…';const {data,error}=await client.from('copy_requests').select('*').order('created_at',{ascending:false});if(error){host.textContent='Could not load requests: '+error.message;return;}if(!data?.length){host.textContent='No copy requests submitted yet.';return;}host.innerHTML=data.map(r=>`<div class="item"><div class="row"><strong>${esc(r.email)}</strong><span class="tag">${esc(r.created_at?new Date(r.created_at).toLocaleString():'')}</span></div><p>Interested in: ${esc(r.interest||r.copy_type||'Not specified')}</p><button class="danger" data-delete-request="${r.id}">Delete request</button></div>`).join('');host.querySelectorAll('[data-delete-request]').forEach(b=>b.onclick=async()=>{if(!confirm('Permanently delete this copy request?'))return;const {error}=await client.from('copy_requests').delete().eq('id',b.dataset.deleteRequest);$('#status').textContent=error?'Delete failed: '+error.message:'Request deleted.';await loadRequests();});}
async function loadAll(){await Promise.all([loadReviews(),loadRequests()]);}$('#refresh-reviews').onclick=loadReviews;$('#refresh-requests').onclick=loadRequests;if(client) ensureOwner();
</script></body></html>
